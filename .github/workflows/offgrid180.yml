name: Build OFFGRID 180
# Builds the OFFGRID 180 offline survival app (PWA + Android APK) and publishes it under Releases.
on:
  push:
    branches: [main, offgrid180]
    paths:
      - 'offgrid180/**'
      - '.github/workflows/offgrid180.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Calculator tests
        run: node offgrid180/tests/calc.test.js

      - name: Build web app and copy into Android assets
        run: |
          python3 offgrid180/build.py "v1.${{ github.run_number }}" --android
          mkdir -p dist
          (cd offgrid180/web && zip -qr ../../dist/OFFGRID-180-web.zip .)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle -p offgrid180/android assembleDebug --no-daemon
      - name: Collect files
        run: |
          cp offgrid180/android/app/build/outputs/apk/debug/app-debug.apk dist/OFFGRID-180.apk
          cat > dist/notes.md <<'NOTES'
          **OFFGRID 180** — offline survival companion for 90–180 days of independent living.

          **Install on Android:** tap **OFFGRID-180.apk** below, then allow installs from your browser if asked.
          **Use in any browser / install as a PWA:** download **OFFGRID-180-web.zip**, or open the GitHub Pages site if enabled.

          Not a substitute for professional medical training or emergency services.
          NOTES
          sed -i 's/^          //' dist/notes.md
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offgrid180-v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: OFFGRID 180 v1.${{ github.run_number }}
          make_latest: false
          body_path: dist/notes.md
          files: |
            dist/OFFGRID-180.apk
            dist/OFFGRID-180-web.zip

      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: offgrid180/web

  # Optional: hosts the installable PWA on GitHub Pages (Settings → Pages → Source: GitHub Actions).
  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
