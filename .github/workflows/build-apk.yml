name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # Is this week's nationwide point data already built?
  check:
    runs-on: ubuntu-latest
    outputs:
      hit: ${{ steps.c.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - id: wk
        run: echo "key=poi-v2-$(date +%G-%V)-${{ hashFiles('tools/build_poi.py') }}" >> "$GITHUB_OUTPUT"
      - id: c
        uses: actions/cache/restore@v4
        with:
          path: build/poi
          key: ${{ steps.wk.outputs.key }}
          lookup-only: true

  # Download and filter OpenStreetMap by U.S. region, in parallel
  region:
    needs: check
    if: needs.check.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        region: [us-west, us-midwest, us-northeast, us-south, us/alaska, us/hawaii]
    steps:
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download ${{ matrix.region }}
        run: |
          sudo mkdir -p /mnt/osm && sudo chown "$USER" /mnt/osm && cd /mnt/osm
          wget -nv --tries=6 --waitretry=30 --retry-on-http-error=429,503 -O region.osm.pbf "https://download.geofabrik.de/north-america/${{ matrix.region }}-latest.osm.pbf"
          ls -la
      - name: Filter emergency points
        run: |
          cd /mnt/osm
          osmium tags-filter region.osm.pbf \
            nwr/amenity=hospital,clinic,doctors,pharmacy,fire_station,police,ranger_station,drinking_water,water_point,fuel,townhall,social_facility \
            n/natural=spring,peak n/man_made=water_well n/emergency=assembly_point,defibrillator \
            nwr/tourism=camp_site nwr/shop=supermarket,convenience,hardware,doityourself,outdoor,general \
            n/place=city,town,village,hamlet \
            -o filtered.osm.pbf --overwrite
          N=$(echo "${{ matrix.region }}" | tr '/' '-')
          osmium export filtered.osm.pbf -f geojsonseq -o "$N.geojsonseq" --overwrite
          gzip "$N.geojsonseq" && ls -la
          echo "N=$N" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: osm-${{ env.N }}
          path: /mnt/osm/${{ env.N }}.geojsonseq.gz
          retention-days: 2

  build:
    needs: [check, region]
    if: always() && needs.check.result == 'success' && (needs.region.result == 'success' || needs.region.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Week key
        id: wk
        run: echo "key=poi-v2-$(date +%G-%V)-${{ hashFiles('tools/build_poi.py') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: poicache
        with:
          path: build/poi
          key: ${{ steps.wk.outputs.key }}
      - name: Get region extracts
        if: steps.poicache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: osm-*
          path: /tmp/osm
          merge-multiple: true
      - name: Tile U.S. points
        if: steps.poicache.outputs.cache-hit != 'true'
        run: |
          ls -la /tmp/osm
          gunzip -f /tmp/osm/*.gz
          python3 tools/build_poi.py build/poi /tmp/osm/*.geojsonseq
      - name: Add points to the app
        run: |
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/poi && cp -r build/poi app/src/main/assets/poi
          du -sh app/src/main/assets/poi

      # ---- App page: inline Tailwind + icons so it runs offline ----
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build app page
        run: |
          npm install --no-audit --no-fund
          npx tailwindcss -c tailwind.config.js -i tools/tw.in.css -o build/tw.css --minify
          mkdir -p dist
          APP_VERSION=v1.${{ github.run_number }} python3 tools/build_web.py web/index.src.html build/tw.css node_modules/lucide/dist/umd/lucide.min.js \
            app/src/main/assets/index.html dist/Survival-App.html

      # ---- Android APK ----
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Collect files
        run: cp app/build/outputs/apk/debug/app-debug.apk dist/Survival-App.apk && ls -la dist
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Survival App v1.${{ github.run_number }}
          make_latest: true
          files: |
            dist/Survival-App.apk
            dist/Survival-App.html
          body_path: dist/notes.md
